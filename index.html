<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>AIGC管理后台</title>
  <link rel="stylesheet" href="./css/style.css?v=20260910-16">
</head>
<body>
  <div class="app-shell" id="app">
    <header class="topbar">
      <button class="brand" type="button" aria-label="漫影工坊首页" data-page="projects">
        <svg class="brand__mark" viewBox="0 0 44 34" aria-hidden="true">
          <defs>
            <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#55d8ff"/>
              <stop offset="1" stop-color="#2688ed"/>
            </linearGradient>
          </defs>
          <path fill="url(#brandGradient)" d="M14.2 2.2a4.4 4.4 0 0 1 7.7.2l5.2 10.2 4.5-7.2a4.4 4.4 0 0 1 7.9.8l4.1 20.1a4.3 4.3 0 0 1-4.2 5.2H27.3a4.3 4.3 0 0 1-3.9-2.5l-2.1-4.5-2.4 4.7a4.3 4.3 0 0 1-3.8 2.3H4.5A4.3 4.3 0 0 1 .7 25z"/>
          <path fill="#fff" fill-opacity=".92" d="M14.2 9.2 7.4 25.1h6.1l7.3-14.3-2.6-5.1a2.2 2.2 0 0 0-4 .1z"/>
        </svg>
        <span class="brand__name">漫影工坊</span>
      </button>

      <div class="breadcrumb" id="breadcrumb" aria-label="面包屑"></div>

      <button class="profile" id="profileButton" type="button" aria-label="用户菜单">
        <span class="profile__avatar">漫</span>
        <span class="profile__dot"></span>
      </button>
    </header>

    <aside class="sidebar" aria-label="主导航">
      <div class="nav-group nav-group--open">
        <button class="nav-group__title" type="button" aria-expanded="true">
          <span class="nav-icon" data-icon="briefcase"></span>
          <span>AIGC管理后台</span>
          <span class="nav-chevron"></span>
        </button>
        <nav class="nav-list">
          <button class="nav-item" type="button" data-page="dashboard">
            <span class="nav-icon" data-icon="chart"></span><span>数据大盘</span>
          </button>
          <button class="nav-item" type="button" data-page="agents">
            <span class="nav-icon" data-icon="nodes"></span><span>智能体管理</span>
          </button>
          <button class="nav-item" type="button" data-page="resources">
            <span class="nav-icon" data-icon="folder"></span><span>资源中心</span>
          </button>
          <button class="nav-item" type="button" data-page="ip-characters">
            <span class="nav-icon" data-icon="ip"></span><span>IP人物库</span>
          </button>
          <div class="nav-project nav-project--open">
            <button class="nav-item nav-item--expandable" type="button" aria-expanded="true">
              <span class="nav-icon" data-icon="book"></span><span>编剧</span><span class="nav-chevron"></span>
            </button>
            <div class="nav-sublist">
              <button class="nav-item nav-item--sub" type="button" data-page="ips">
                <span class="nav-icon" data-icon="ip"></span><span>IP库</span>
              </button>
              <button class="nav-item nav-item--sub" type="button" data-page="topics">
                <span class="nav-icon" data-icon="topic"></span><span>选题策划库</span>
              </button>
              <button class="nav-item nav-item--sub" type="button" data-page="scripts">
                <span class="nav-icon" data-icon="book"></span><span>剧本库</span>
              </button>
            </div>
          </div>
          <button class="nav-item" type="button" data-page="production">
            <span class="nav-icon" data-icon="image"></span><span>制作</span>
          </button>
          <button class="nav-item" type="button" data-page="editing">
            <span class="nav-icon" data-icon="clapper"></span><span>剪辑</span>
          </button>
          <div class="nav-project nav-project--open">
            <button class="nav-item nav-item--expandable" type="button" aria-expanded="true">
              <span class="nav-icon" data-icon="briefcase"></span><span>制片</span><span class="nav-chevron"></span>
            </button>
            <div class="nav-sublist">
              <button class="nav-item nav-item--sub" type="button" data-page="projects">
                <span class="nav-icon" data-icon="project"></span><span>项目立项</span>
              </button>
              <button class="nav-item nav-item--sub" type="button" data-page="delivery">
                <span class="nav-icon" data-icon="delivery"></span><span>交付中心</span>
              </button>
            </div>
          </div>
          <button class="nav-item" type="button" data-page="works">
            <span class="nav-icon" data-icon="clapper"></span><span>作品库</span>
          </button>
          <button class="nav-item" type="button" data-page="costs">
            <span class="nav-icon" data-icon="list"></span><span>成本工时管理</span>
          </button>
          <button class="nav-item" type="button" data-page="image-generate">
            <span class="nav-icon" data-icon="wand"></span><span>AI自由创作</span>
          </button>
        </nav>
      </div>

    </aside>

    <section class="workspace">
      <div class="page-tabs" id="pageTabs" aria-label="已打开页面"></div>
      <main class="page-canvas" id="pageContent" tabindex="-1"></main>
    </section>
  </div>

  <div class="modal-layer" id="modalLayer" aria-live="polite"></div>
  <div class="toast-layer" id="toastLayer" aria-live="polite"></div>

  <script src="./js/app.js?v=20260910-26"></script>
</body>
</html>
